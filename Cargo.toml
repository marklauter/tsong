[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aws-lc-rs = { version = "1.19.0", features = ["prebuilt-nasm"] }
axum = "0.8.9"
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
http-body-util = "0.1.5"
ipnet = { version = "2.12.2", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
moka = { version = "0.12.16", features = ["future"] }
pem = "4.0.0"
p256 = { version = "0.14.0", features = ["ecdsa", "pem"] }
prometheus-client = "0.26.0"
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.1"
tower = "0.5.3"
tsong-clock = { version = "0.1.0", path = "crates/tsong-clock" }
tsong-config = { version = "0.1.0", path = "crates/tsong-config" }
tsong-gateway = { version = "0.1.0", path = "crates/tsong-gateway" }
tsong-issuer = { version = "0.1.0", path = "crates/tsong-issuer" }
tsong-keys = { version = "0.1.0", path = "crates/tsong-keys" }
tsong-secrets = { version = "0.1.0", path = "crates/tsong-secrets" }
tsong-validate = { version = "0.1.0", path = "crates/tsong-validate" }
url = { version = "2.5.8", features = ["serde"] }

# Tsong's own code is safe Rust, tests included; only dependencies may use
# unsafe.
[workspace.lints.rust]
unsafe_code = "forbid"

# No code panics, tests included: failures are values, and tests return
# Result and propagate with ?. assert! and its kin are how a test fails.
[workspace.lints.clippy]
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

# cargo-mutants builds every mutant; debug info only slows those builds.
# Line numbers in backtraces, without full debug info, and no incremental
# state: both keep target/ small.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.mutants]
inherits = "test"
debug = "none"
