# A bootstrap file for running Tsong in local podman: `deploy/podman/run.sh`.
# It is a stub: it reads the config from a file mounted beside it, and
# allows health checks from anywhere, which only suits a local machine.

# ── config source ─────────────────────────────────────
# tsong.toml, mounted beside this file at /etc/tsong. A file is read once.
[source]
store = "file"
path = "tsong.toml"

# ── admin listener ────────────────────────────────────
# GET /status and GET /metrics, for clients in the config's gateway.allow.
[admin]
listen = "0.0.0.0:8445"

# ── health listener ───────────────────────────────────
# GET /health/live and GET /health/ready. Podman's port forwarding hides
# the caller's address, so locally the allow list is open; in a real
# deployment it names the load balancer's subnets.
[health]
listen = "0.0.0.0:8447"
allow = ["0.0.0.0/0", "::/0"]
drain = "00:00:05"  # readiness fails this long on shutdown before the listeners close
