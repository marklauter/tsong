# A stub config for running Tsong in local podman. It starts and serves
# its discovery document and JWKS, but trusts no issuer and has no route
# yet, so the gateway answers every request with 404. Fill in the
# commented sections to exchange real tokens.

[issuer]
url = "https://tsong.localhost"
listen = "0.0.0.0:8444"
token_lifetime = "00:15:00"
clock_skew = "00:00:30"

[issuer.signing]
provider = "file"

# run.sh generates this key into deploy/podman/keys, which Git ignores,
# and mounts it read-only.
[[issuer.signing.keys]]
kid = "local-1"
private_key = { file = "/etc/tsong/keys/signing.pem" }
state = "active"

[gateway]
listen = "0.0.0.0:8443"
# Podman's port forwarding hides the caller's address, so locally every
# client is allowed. `tsong check` warns about this; a real deployment
# lists its clients' networks.
allow = ["0.0.0.0/0", "::/0"]

[gateway.cache]
max_entries = 10_000

