name: Release

# Pushing a version tag, such as v0.2.0, builds the release and signs it:
# the Linux binary and its SHA256SUMS go on a draft GitHub release, and
# the container image goes to ghcr.io/marklauter/tsong. Each is signed
# with a GitHub artifact attestation, a Sigstore signature tied to this
# workflow and commit, so no signing key is stored anywhere.
# SECURITY.md says how to verify them. The maintainer reviews the draft's
# notes and publishes it.
on:
  push:
    tags: [ "v*" ]

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    runs-on: ubuntu-latest
    permissions:
      # Creates the draft release and uploads its files.
      contents: write
      # Signs the attestation with a certificate for this workflow.
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Release only a commit on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "$GITHUB_REF_NAME points at a commit that isn't on main" >&2
          exit 1
        fi
    # No build cache: the signed binary is built from a clean target and
    # freshly fetched, checksum-verified crates, so nothing a cache holds
    # can reach it.
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

    - name: Build the release binary
      run: scripts/release-build.sh

    - name: Name it and sum it
      run: |
        mkdir dist
        cp target/release/tsong dist/tsong-x86_64-linux
        (cd dist && sha256sum tsong-x86_64-linux > SHA256SUMS)
        cat dist/SHA256SUMS

    - name: Sign it with an attestation
      id: attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          dist/tsong-x86_64-linux
          dist/SHA256SUMS

    # The attestation's signed bundle goes on the release too, so a file
    # can be verified offline and tools that look for signatures beside a
    # release's files, such as OpenSSF Scorecard, find it.
    - name: Attach the signed provenance
      env:
        BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      run: cp "$BUNDLE" dist/tsong.intoto.jsonl

    # A version's files are signed once. A release that already has them,
    # or has been published, is never changed.
    - name: Attach it to a draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
          if [ "$draft" != true ]; then
            echo "release $TAG is already published; it is never changed" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" dist/* --draft --verify-tag --generate-notes \
            --title "${TAG#v}" --repo "$GITHUB_REPOSITORY"
        fi

  image:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the image to ghcr.io/marklauter/tsong.
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Release only a commit on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "$GITHUB_REF_NAME points at a commit that isn't on main" >&2
          exit 1
        fi
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # A version's image is pushed and signed once; an existing tag is never
    # moved to another image.
    - name: Refuse an image tag that already exists
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if docker buildx imagetools inspect "ghcr.io/marklauter/tsong:$TAG" > /dev/null 2>&1; then
          echo "ghcr.io/marklauter/tsong:$TAG already exists; it is never replaced" >&2
          exit 1
        fi

    - name: Build and push the image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Containerfile
        push: true
        tags: ghcr.io/marklauter/tsong:${{ github.ref_name }}

    - name: Sign it with an attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/marklauter/tsong
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
