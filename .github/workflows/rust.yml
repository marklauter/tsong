name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # The jobs below run only when the commits change Rust code, its build
  # settings or this pipeline. Runner minutes are limited.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - id: rust
      uses: ./.github/actions/changes
      with:
        pattern: '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain\.toml$|^deny\.toml$|^fuzz/|^scripts/fuzz\.sh$|^\.github/(workflows/rust\.yml|actions/)'

  format:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: rustfmt

    - name: Verify formatting
      run: cargo fmt --all --check

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: clippy

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked

    - name: Docs
      run: cargo doc --workspace --no-deps --locked

    # The workspace lints, unsafe_code = "forbid" among them, reach only
    # the crates that inherit them.
    - name: Every crate inherits the workspace lints
      # Fails closed: a broken query or an empty list fails the step
      # rather than checking nothing.
      run: |
        set -euo pipefail
        manifests=$(cargo metadata --no-deps --format-version 1 --locked |
          jq -r '.packages[] | select(.manifest_path | contains("/crates/")) | .manifest_path')
        expected=$(find crates -mindepth 2 -maxdepth 2 -name Cargo.toml | wc -l)
        found=$(printf '%s\n' "$manifests" | grep -c . || true)
        if [ "$expected" -eq 0 ] || [ "$found" -ne "$expected" ]; then
          echo "found $found crate manifests in the metadata, expected $expected"
          exit 1
        fi
        missing=0
        while read -r manifest; do
          if ! grep -Pzq '\[lints\]\s*\nworkspace = true' "$manifest"; then
            echo "missing [lints] workspace = true: $manifest"
            missing=1
          fi
        done <<< "$manifests"
        exit "$missing"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Linux only, where Tsong runs.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [ dev, release ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust

    - name: Build
      run: cargo build --workspace --all-targets --locked --profile ${{ matrix.profile }}

    - name: Test
      run: cargo test --workspace --locked --profile ${{ matrix.profile }}

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-rust
      with:
        components: llvm-tools-preview
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-llvm-cov@0.9.1

    - name: Coverage (fails under 95% of lines)
      run: cargo llvm-cov --workspace --locked --fail-under-lines 95

  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-audit@0.22.2

    - name: Audit dependencies against the RustSec advisory database
      run: cargo audit --deny warnings

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # The runner's own stable cargo reads the metadata; the components
      # rust-toolchain.toml names would go unused.
      RUSTUP_TOOLCHAIN: stable
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-deny@0.21.0

    # Sources, licenses and banned crates; advisories are the audit job's.
    - name: Check where dependencies come from and their licenses
      run: cargo deny --locked check bans licenses sources

  # A short run of every fuzz target, so a change that makes one panic
  # fails here; the weekly workflow fuzzes each for longer.
  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # libFuzzer needs a nightly compiler; pinned like every other tool.
      NIGHTLY: nightly-2026-10-01
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install nightly
      run: rustup toolchain install $NIGHTLY --profile minimal
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-fuzz@0.13.2
    # The corpus a run grows is kept for the next, so each starts where the
    # last left off.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: fuzz-corpus-
    - name: Fuzz every target for 20 seconds
      run: scripts/fuzz.sh 20

  mutants:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Four runners each test a quarter of the mutants, so the wait is a
    # quarter as long; the minutes billed stay about the same.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2, 3 ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-rust
    - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-mutants@27.1.0

    # Only the lines a pull request changes, so the existing survivors don't
    # block it, and only when it changes Rust code or its build settings.
    - name: Mutation testing (fails when a mutant of changed code survives)
      if: github.event_name == 'pull_request'
      run: |
        if ! git diff --name-only origin/${{ github.base_ref }}... | grep -Eq '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/'; then
          echo "No Rust changes, skipping mutation testing"
          exit 0
        fi
        git diff origin/${{ github.base_ref }}... > pr.diff
        # Three mutants at a time on the runner's four cores: the job is
        # billed by its length, so this saves minutes as well as waiting.
        cargo mutants --workspace --in-diff pr.diff -j 3 --shard ${{ matrix.shard }}/4 -- --locked

  # The single required status check: the ruleset names this job, not the
  # matrix legs. Skipped jobs pass only when there were no Rust changes.
  passed:
    if: always()
    needs: [ changes, format, lint, test, coverage, audit, deny, fuzz, mutants ]
    runs-on: ubuntu-latest
    steps:
    - name: Require every job to succeed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (needs.changes.outputs.rust != 'false' && contains(needs.*.result, 'skipped'))
      run: exit 1
