# cargo-deny checks the dependency graph: where crates come from, which
# licenses they carry, and which crates and versions are banned. CI and the
# pre-push hook leave advisories to cargo audit:
#
#   cargo deny check bans licenses sources

[graph]
# Tsong runs on Linux, so dependencies only other platforms pull in don't
# count.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[licenses]
# Permissive licenses only. A dependency under any other license fails the
# check until someone reads it and adds it here.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
# A version requirement of "*" lets any release in, so none is allowed.
wildcards = "deny"
# Two versions of one crate build twice and audit twice. It isn't a fault
# on its own, since it usually waits on an upstream release, so it warns.
multiple-versions = "warn"
# Duplicates that only an upstream release can remove, each the older
# version. A new duplicate, or a newer version of one of these, still
# warns.
skip = [
    { crate = "untrusted@0.7.1", reason = "aws-lc-rs uses it; rustls-webpki uses 0.9" },
    { crate = "syn@2.0.119", reason = "zeroize_derive and the jni macros use it; other proc macros use syn 3" },
]
# OpenSSL would be a second TLS and crypto stack beside rustls and
# aws-lc-rs; native-tls is how it usually arrives.
deny = [
    { crate = "native-tls", reason = "rustls and aws-lc-rs are Tsong's TLS and crypto" },
    { crate = "openssl", reason = "rustls and aws-lc-rs are Tsong's TLS and crypto" },
    { crate = "openssl-sys", reason = "rustls and aws-lc-rs are Tsong's TLS and crypto" },
]

[sources]
# Every crate comes from crates.io: no other registry, no Git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
